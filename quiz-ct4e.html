    o:["ระบบ ADF (Automatic Direction Finder)","ระบบ DME (Distance Measuring Equipment)","ระบบ TACAN (Tactical Air Navigation)","ระบบ VOR (VHF Omni-directional Range)"], a:2 },
  { q:"ให้ข้อมูลระยะทางระหว่างอากาศยานกับสถานีภาคพื้น, อัตราเร็ว (GROUND SPEED) และเวลา (TIME TO STATION) โดยระยะปฏิบัติการขึ้นอยู่กับความสูงของ บ. — เป็นความสามารถของเครื่องช่วยอากาศแบบใด ?",
    o:["ระบบ VOR (VHF Omni-directional Range)","ระบบ ADF (Automatic Direction Finder)","ระบบ Transponder","ระบบ DME (Distance Measuring Equipment)"], a:3 },
  { q:"ระบบวิทยุและระบบเครื่องช่วยเดินอากาศของ บ.ฝ.16 ก (CT-4E) จะใช้งานร่วมกับระบบ EFIS หรือจอ EFD1000 — อุปกรณ์ใดที่ <b>ไม่ได้</b> ใช้งานร่วมกับจอ EFD1000 ?",
    o:["ระบบ ADF (KR-87)","ระบบ DME (KN-62A)","ระบบ COM/NAV/GPS SYSTEM (IFD440/GNS430)","ระบบ COM/NAV/GPS SYSTEM (KX-165)"], a:1 },
  { q:"ELT (Emergency Locator Transmitter) หรือเครื่องส่งสัญญาณระบุตำแหน่งฉุกเฉิน — ตำแหน่ง Standby โดยปกติ ELT Switch จะอยู่ในตำแหน่งไหน ?",
    o:["ON","ARMED","RESET TEST","ไม่มีข้อใดถูกต้อง"], a:1 },
  { q:"ระบบใดเป็นระบบเพื่อพิสูจน์ให้ทราบว่าเป็นอากาศยานของมิตรหรือศัตรู ?",
    o:["ระบบ VOR (VHF Omni-directional Range)","ระบบ ADF (Automatic Direction Finder)","ระบบ Transponder","ระบบ DME (Distance Measuring Equipment)"], a:2 }
];

const LETTERS = ["ก","ข","ค","ง"];
let answered = 0, correct = 0;

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  document.getElementById('total-count').textContent = QUESTIONS.length;

  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = 'ข้อสอบความรู้อากาศยาน บ.ฝ.16 ก (CT-4E)' + `<span>${QUESTIONS.length} ข้อ</span>`;
  container.appendChild(hdr);

  QUESTIONS.forEach((q, idx) => {
    q._answered = false;
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q-' + idx;
    const choicesHtml = q.o.map((ch, ci) =>
      `<button class="choice-btn" onclick="answer(${idx},${ci})" id="btn-${idx}-${ci}">
         <span class="letter">${LETTERS[ci]}.</span><span>${ch}</span>
       </button>`
    ).join('');
    card.innerHTML = `
      <div class="q-number">ข้อ ${idx + 1}</div>
      <div class="q-text">${q.q}</div>
      <div class="choices">${choicesHtml}</div>`;
    container.appendChild(card);
  });
}

function answer(qIdx, chosen) {
  const q = QUESTIONS[qIdx];
  if (q._answered) return;
  q._answered = true;
  answered++;

  const card = document.getElementById('q-' + qIdx);
  q.o.forEach((_, ci) => {
    const btn = document.getElementById(`btn-${qIdx}-${ci}`);
    btn.disabled = true;
    if (ci === q.a) btn.classList.add('correct');
    else if (ci === chosen && chosen !== q.a) btn.classList.add('wrong');
  });

  if (chosen === q.a) { correct++; card.classList.add('answered-correct'); }
  else card.classList.add('answered-wrong');

  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('score-pct').textContent = Math.round(correct / answered * 100) + '%';
  document.getElementById('progress-fill').style.width = (answered / QUESTIONS.length * 100) + '%';

  if (answered === QUESTIONS.length) showEnd();
}

function showEnd() {
  document.getElementById('end-screen').style.display = 'block';
  const pct = Math.round(correct / QUESTIONS.length * 100);
  document.getElementById('final-score').textContent = pct + '%';
  document.getElementById('final-detail').textContent = `ตอบถูก ${correct} จาก ${QUESTIONS.length} ข้อ`;
  document.getElementById('end-screen').scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  answered = 0; correct = 0;
  document.getElementById('answered-count').textContent = 0;
  document.getElementById('correct-count').textContent = 0;
  document.getElementById('score-pct').textContent = '0%';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('end-screen').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
