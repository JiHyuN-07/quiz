const PARTS = [
  { id: 1, title: "Part 1 — Air Law 25 ข้อแรก", count: 25 },
  { id: 2, title: "Part 2 — Rules of the Air Exam", count: 50 },
  { id: 3, title: "Part 3 — โผจริง (ข้อใหม่)", count: 24 }
];

const LETTERS = ["ก","ข","ค","ง"];
let answered = 0, correct = 0;

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  document.getElementById('total-count').textContent = QUESTIONS.length;

  const nav = document.createElement('nav');
  nav.className = 'part-nav';
  nav.setAttribute('aria-label', 'เลือกส่วนข้อสอบ');
  PARTS.forEach(part => {
    const link = document.createElement('a');
    link.href = '#part-' + part.id;
    link.textContent = part.title + ' (' + part.count + ' ข้อ)';
    nav.appendChild(link);
  });
  container.appendChild(nav);

  let currentPart = 0;
  QUESTIONS.forEach((q, idx) => {
    q._answered = false;
    q._correct = false;
    if (q.s !== currentPart) {
      const part = PARTS.find(item => item.id === q.s);
      const hdr = document.createElement('div');
      hdr.className = 'section-header';
      hdr.id = 'part-' + part.id;
      hdr.textContent = part.title;
      const count = document.createElement('span');
      count.textContent = part.count + ' ข้อ';
      hdr.appendChild(count);
      container.appendChild(hdr);
      currentPart = q.s;
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q-' + idx;
    const number = document.createElement('div');
    number.className = 'q-number';
    number.textContent = 'ข้อ ' + q.n;
    const question = document.createElement('div');
    question.className = 'q-text';
    question.innerHTML = q.q;
    const choices = document.createElement('div');
    choices.className = 'choices';
    q.o.forEach((choice, ci) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'choice-btn';
      button.id = 'btn-' + idx + '-' + ci;
      button.onclick = () => answer(idx, ci);
      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.textContent = LETTERS[ci] + '.';
      const label = document.createElement('span');
      label.textContent = choice;
      button.append(letter, label);
      choices.appendChild(button);
    });
    card.append(number, question, choices);
    container.appendChild(card);
  });
}

function answer(qIdx, chosen) {
  const q = QUESTIONS[qIdx];
  if (q._answered) return;
  q._answered = true;
  q._correct = chosen === q.a;
  answered++;

  const card = document.getElementById('q-' + qIdx);
  q.o.forEach((_, ci) => {
    const btn = document.getElementById(`btn-${qIdx}-${ci}`);
    btn.disabled = true;
    if (ci === q.a) btn.classList.add('correct');
    else if (ci === chosen && chosen !== q.a) btn.classList.add('wrong');
  });

  if (chosen === q.a) { correct++; card.classList.add('answered-correct'); }
  else card.classList.add('answered-wrong');

  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('score-pct').textContent = Math.round(correct / answered * 100) + '%';
  document.getElementById('progress-fill').style.width = (answered / QUESTIONS.length * 100) + '%';

  if (answered === QUESTIONS.length) showEnd();
}

function showEnd() {
  document.getElementById('end-screen').style.display = 'block';
  const pct = Math.round(correct / QUESTIONS.length * 100);
  document.getElementById('final-score').textContent = pct + '%';
  document.getElementById('final-detail').textContent = `ตอบถูก ${correct} จาก ${QUESTIONS.length} ข้อ`;
  document.getElementById('part-detail').textContent = PARTS.map(part => {
    const group = QUESTIONS.filter(q => q.s === part.id);
    return 'Part ' + part.id + ': ' + group.filter(q => q._correct).length + '/' + group.length;
  }).join(' · ');
  document.getElementById('end-screen').scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  answered = 0; correct = 0;
  document.getElementById('answered-count').textContent = 0;
  document.getElementById('correct-count').textContent = 0;
  document.getElementById('score-pct').textContent = '0%';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('end-screen').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
