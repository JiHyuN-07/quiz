let answered = 0, gradedAnswered = 0, correct = 0;
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  for (const [idx, q] of questions.entries()) {
    q._answered = false;
    const card = document.createElement('article'); card.className='question-card'; card.id='q-'+idx;
    const choices = q.c.map((c,ci) => '<button type="button" class="choice-btn" id="btn-'+idx+'-'+ci+'" onclick="answer('+idx+','+ci+')"><span class="letter">'+String.fromCharCode(65+ci)+'.</span><span>'+escapeHtml(c)+'</span></button>').join('');
    card.innerHTML='<div class="q-number">ข้อ '+q.n+(q.uncertain?'<span class="uncertain-tag">ไม่มั่นใจในคำตอบ</span>':'')+'</div><div class="q-text">'+escapeHtml(q.q)+'</div>'+(q.figure||'')+'<div class="choices">'+choices+'</div><div class="explanation" id="ex-'+idx+'"><strong>เฉลย '+String.fromCharCode(65+q.a)+':</strong> '+escapeHtml(q.ex)+'</div>';
    container.appendChild(card);
  }
}
function answer(idx, chosen) {
  const q=questions[idx]; if(q._answered) return;
  q._answered=true; answered++;
  q.c.forEach((_,ci)=>{const button=document.getElementById('btn-'+idx+'-'+ci); button.disabled=true; if(q.a!==null && ci===q.a) button.classList.add('correct'); else if(ci===chosen && q.a!==null) button.classList.add('wrong');});
  document.getElementById('ex-'+idx).classList.add('visible');
  const card=document.getElementById('q-'+idx);
  if(q.a===null) card.classList.add('answered-review');
  else { gradedAnswered++; if(chosen===q.a) {correct++; card.classList.add('answered-correct');} else card.classList.add('answered-wrong'); }
  document.getElementById('answered-count').textContent=answered;
  document.getElementById('correct-count').textContent=correct;
  document.getElementById('score-pct').textContent=(gradedAnswered?Math.round(correct/gradedAnswered*100):0)+'%';
  document.getElementById('progress-fill').style.width=(answered/questions.length*100)+'%';
  if(answered===questions.length) showEnd();
}
function showEnd() {
  document.getElementById('end-screen').style.display='block';
  document.getElementById('final-score').textContent=Math.round(correct/50*100)+'%';
  document.getElementById('final-detail').textContent='ตอบถูก '+correct+' จาก 50 ข้อที่คิดคะแนน';
  document.getElementById('end-screen').scrollIntoView({behavior:'smooth'});
}
function restartQuiz() {
  answered=0; gradedAnswered=0; correct=0;
  document.getElementById('answered-count').textContent='0';
  document.getElementById('correct-count').textContent='0';
  document.getElementById('score-pct').textContent='0%';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('end-screen').style.display='none';
  buildQuiz(); window.scrollTo({top:0,behavior:'smooth'});
}
buildQuiz();
</script>
